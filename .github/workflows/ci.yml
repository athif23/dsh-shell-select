# The matrix is the point of this workflow, not a formality.
#
# The catalog, the dialect builders, the resolution walk, and the
# working-directory rules are pure functions of `(platform, environment)` and run
# on every runner; the suites themselves are written so a simulated Windows
# composition passes on a POSIX host and the other way round. What differs by
# platform is execution: the POSIX lane is spawned on ubuntu and macos, the
# Windows lane on windows, and `test/integration.spec.mjs` runs whichever lane
# belongs to the runner it is on. A required shell of that lane never skips.
#
# `test/lanes.mjs` fixes which shells each lane must cover, and
# `test/platform-lanes.spec.mjs` asserts that the lanes still name real catalog
# entries, so a lane that stops being covered fails rather than going quiet.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every GitHub runner checks the repository out inside the runner user's home
# directory, and no fixture may be created under a user profile. The suites
# refuse a profile-contained fixture root and say how to approve one, so CI names
# a scratch directory outside the profile: `/tmp` on the POSIX runners, and the
# runner's own temp volume on Windows (`D:\a\_temp`, not `C:\Users\...`).
env:
  DSH_SHELL_SELECT_TEST_TMP: ${{ runner.os == 'Windows' && format('{0}/dsh-shell-select', runner.temp) || '/tmp/dsh-shell-select' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The lockfile is committed, so the CI graph is the reviewed one rather
      # than whatever the ranges resolve to that day.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
